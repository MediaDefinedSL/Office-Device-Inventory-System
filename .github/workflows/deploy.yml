name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install frontend dependencies
      - name: Install Frontend dependencies
        run: |
          cd Frontend
          npm install

      # Build frontend using Vite
      - name: Build Frontend
        run: |
          cd Frontend
          npm run build

      # Install Vercel CLI
      - name: Install Vercel CLI
        run: npm install -g vercel

      # Force correct project link (IMPORTANT FIX)
      - name: Link Vercel Project
        run: vercel link --yes --project office-device-inventory-system --token=${{ secrets.VERCEL_TOKEN }}

      # Deploy without auto-detection errors
      - name: Deploy to Vercel
        run: vercel deploy ./Frontend --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
